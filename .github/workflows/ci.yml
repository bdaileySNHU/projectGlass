name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-glass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project-glass/package-lock.json
      - run: npm ci
      - run: npm run validate-photos
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
